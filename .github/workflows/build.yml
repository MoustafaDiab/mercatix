name: Build Mercatix APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Recreate Android Directory Safely
        run: |
          if [ -d "lib" ]; then cp -r lib lib_backup; fi
          flutter create . --platform android --org com.mercatix
          if [ -d "lib_backup" ]; then rm -rf lib && mv lib_backup lib; fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mercatix-App
          path: build/app/outputs/flutter-apk/app-release.apk
